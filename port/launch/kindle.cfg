# Live buttons overwrite this file. Unplug, edit, eject, then open Doom again.
# rotate: 0, 90, 180, 270. Tap R# until the button bar sits on the bottom edge.
# waveform: A2 (fast, 1-bit), DU (faster gray), GC (slow, 16 gray).
# contrast: 100 is flat, 160 punches midtones for e-ink.
# flash_every: full GC16 wipe of the view every N frames while on A2. 0 disables.
# invert: 1 flips black and white.
# touch: 0-7. bit0 swaps axes, bit1 mirrors x, bit2 mirrors y. Tap T# until
#        the left half walks forward and the right half turns.
# dither: 1 asks the panel for hardware dither (Bellatrix4 Y1/Y4).
rotate=90
waveform=A2
contrast=160
flash_every=40
invert=0
touch=0
dither=1
